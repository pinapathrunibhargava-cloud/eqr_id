<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>QR History | eQR ID</title>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: #f8f9fa;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background: white;
        padding: 30px 40px;
        border-radius: 15px;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      h2 {
        margin-bottom: 20px;
        color: #333;
      }

      img {
        width: 220px;
        height: 220px;
        object-fit: cover;
        margin-bottom: 20px;
        border-radius: 12px;
        border: 2px solid #007bff;
      }

      .info {
        text-align: left;
        margin-bottom: 15px;
      }

      .info strong {
        display: inline-block;
        width: 140px;
        color: #555;
      }

      .back-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 25px;
        background: #007bff;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
      }

      .back-btn:hover {
        background: #0056b3;
      }

      /* Responsive */
      @media (max-width: 480px) {
        .container {
          padding: 20px;
        }

        img {
          width: 180px;
          height: 180px;
        }

        .info strong {
          width: 120px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div th:if="${qrDetails}">
        <h2>Your QR Code</h2>
        <img
          th:src="'data:image/png;base64,' + ${qrDetails.qrImageBase64}"
          alt="QR Code"
        />
        <div class="info">
          <p>
            <strong>Full Name:</strong>
            <span th:text="${qrDetails.fullName}"></span>
          </p>
          <p>
            <strong>Vehicle No:</strong>
            <span th:text="${qrDetails.vehicleNo}"></span>
          </p>
          <p>
            <strong>Blood Group:</strong>
            <span th:text="${qrDetails.bloodGroup}"></span>
          </p>
          <p>
            <strong>Emergency Contact:</strong>
            <span th:text="${qrDetails.emergencyContact}"></span>
          </p>
          <p>
            <strong>Address:</strong>
            <span th:text="${qrDetails.address}"></span>
          </p>
        </div>
      </div>

      <div th:if="${message}">
        <h2 th:text="${message}"></h2>
      </div>

      <a href="/userhome" class="back-btn">← Back to Dashboard</a>
    </div>
  </body>
</html>
